{{- if and .Values.secret.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashercontrol.secretName" . }}
  labels:
    {{- include "dashercontrol.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{ .Values.existingSecretKeys.databaseUrl }}: {{ printf "postgres://%s:%s@database:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password .Values.postgresql.auth.database | quote }}
  {{- else }}
  {{ .Values.existingSecretKeys.databaseUrl }}: {{ required "Set databaseUrl when postgresql.enabled is false" .Values.databaseUrl | quote }}
  {{- end }}
  {{ .Values.existingSecretKeys.csrfTokenKey }}: {{ .Values.secret.csrfTokenKey | quote }}
  {{ .Values.existingSecretKeys.rocketSecretKey }}: {{ .Values.secret.rocketSecretKey | quote }}
{{- end }}
