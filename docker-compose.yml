services:
  dashercontrol:
    build: .
    image: antoine13/dashercontrol
    container_name: dashercontrol
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-root}@database:5432/diesel
      ROCKET_PROFILE: release
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: dashercontrol_db
    hostname: database
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_USER: postgres
      POSTGRES_DB: diesel
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diesel"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
