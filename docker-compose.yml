services:
  dashercontrol:
    build:
      context: .
      dockerfile: Dockerfile
    image: antoine13/dashercontrol
    container_name: dashercontrol
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-root}@database:5432/diesel
      ROCKET_PROFILE: release
      # Required for JWT/session (see .env.example). Override in `.env` for production.
      CSRF_TOKEN_KEY: ${CSRF_TOKEN_KEY:-01234567890123456789012345678901}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: dashercontrol_db
    hostname: database
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_USER: postgres
      POSTGRES_DB: diesel
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diesel"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  pgdata: {}
